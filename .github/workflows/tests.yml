name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x sentinel.sh
          chmod +x tests/run_tests.sh

      - name: Run test suite
        run: ./tests/run_tests.sh

      - name: Run a real scan against this CI runner (smoke test)
        run: ./sentinel.sh --output-dir /tmp/ci_scan

      - name: Shellcheck (lint)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
